# Coverage reports; it does not gate. The test run that produces the report is
# what blocks a merge, and a percentage moving says nothing about whether the
# change under review is right.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: 'condensed_header, diff, files'
  require_changes: true
