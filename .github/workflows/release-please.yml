name: release-please

on:
  push:
    branches: [main]

# Scoped per job: each needs something different, and none needs it all.
permissions: {}

# Queued, never cancelled: a release stopped halfway can leave a tag without
# its data rebuild or its Shortcut attached.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: maintain the release PR
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Rebuild the site with the new code. A release made with GITHUB_TOKEN starts
  # no `release` workflow, but a workflow_dispatch from it does.
  data:
    name: rebuild the data site
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run data.yml --ref "${{ github.event.repository.default_branch }}" -f force=true

  # Unsigned: signing needs a Mac logged into iCloud, which runners never are.
  shortcut:
    name: attach the unsigned Shortcut
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run capsule-caffeine shortcut -o "Nespresso-Log-unsigned.shortcut"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Nespresso-Log-unsigned.shortcut --clobber
