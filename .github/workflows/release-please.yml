name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  # Rebuild the site with the new code; its release doesn't trigger `release` events.
  data:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run data.yml --ref "${{ github.event.repository.default_branch }}" -f force=true

  # Unsigned: signing needs a Mac logged into iCloud, which runners never are.
  shortcut:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run capsule-caffeine shortcut -o "Nespresso-Log-unsigned.shortcut"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" Nespresso-Log-unsigned.shortcut --clobber
