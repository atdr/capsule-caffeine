name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs are cancelled on pull requests only. On main every commit
# keeps its own result, so a red one points at the commit that broke it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown:
    uses: atdr/github-boilerplate/.github/workflows/markdown.yml@v0.2.0

  conventions:
    uses: atdr/github-boilerplate/.github/workflows/conventions.yml@v0.2.0

  # The one check branch protection requires from this workflow.
  gate:
    name: checks gate
    # Not always(): a run superseded by a newer one is cancelled, and its gate
    # would report a failure on the same commit the newer run is checking.
    if: ${{ !cancelled() }}
    needs: [markdown, conventions]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled) echo "::error::a required job finished as $result"; exit 1 ;;
            esac
          done
