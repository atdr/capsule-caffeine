version: 2
updates:
  # A runtime dependency bump changes what users install, so it has to reach
  # the changelog and cut a release: `fix` is shown by release-please, `chore`
  # is hidden. Dev dependencies affect nobody downstream, so they stay `chore`.
  #
  # The uv ecosystem, because the versions live in uv.lock: CI and the data run
  # both install from it. A runtime bump reaches the weekly scrape through the
  # patch release its `fix` prefix cuts.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # `applies-to` defaults to version-updates. Production updates and every
      # security update stay ungrouped, so each arrives as its own reviewable
      # PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  # Major-tag pins (@v7) absorb minor and patch releases on their own but never
  # cross a major; this surfaces new majors as PRs. It also bumps the
  # atdr/github-boilerplate reusable workflows, which are pinned to exact tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # A new release waits out GitHub's default three days before Dependabot
    # offers it, time for a compromised one to be caught and pulled. atdr's own
    # actions skip the wait: there is no third party to wait on, and a
    # boilerplate fix would otherwise reach callers days late.
    cooldown:
      default-days: 3
      exclude:
        - 'atdr/*'
    # Dependabot counts each reusable workflow file as its own dependency, so
    # one boilerplate release would open a PR per pinned file and leave the
    # pins on mixed versions between merges. Grouped, they move together.
    groups:
      github-boilerplate:
        patterns:
          - 'atdr/github-boilerplate*'
