name: Bug report
description: capsule-caffeine did something wrong, or crashed
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Please write in plain English: short sentences, everyday words, and exactly what you saw. There is no need to write it up formally.

        **Do not paste secrets** (API keys, tokens, private URLs). Describe what is configured, not its values.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues for this problem
          required: true
        - label: I am running the latest version
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version you are running.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: The full output covering the problem.
      render: shell
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and runtime version.
    validations:
      required: true
