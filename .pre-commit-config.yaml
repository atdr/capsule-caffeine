# `pre-commit install` installs both hook types, because of the line below.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Keep rev in step with the ruff pin in pyproject.toml's dev extra, so the
  # hook and CI never disagree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-frontmatter==2.1.2
  # The local half of conventional.yml's commit check, without Node. The type
  # list must match conventional.yml; the conventions check enforces that.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        args: [--strict, feat, fix, perf, refactor, test, docs, chore, ci]
