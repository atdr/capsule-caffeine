<!doctype html><html><head><meta charset="utf-8"><title>capsule-caffeine</title><link rel="stylesheet" href="card-base.css"><style>
:root { --bg: #160e09; --ink: #ecc894; --ink-soft: #c9b39b; --accent: #5fd3c6; }
body { background:
  radial-gradient(560px 480px at 80% 46%, rgba(214,150,84,.30) 0%, transparent 70%),
  radial-gradient(420px 360px at 8% 92%, rgba(150,86,44,.22) 0%, transparent 70%),
  linear-gradient(160deg, #24170f 0%, #120b07 100%); }
#beans { position: absolute; inset: 0; z-index: 0; }
.copy { top: -30px; width: 560px; }
.name { font-size: 100px; padding-bottom: 6px;
  background: linear-gradient(180deg, #f3d6a8 0%, #dcae72 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tagline { color: #dcc8b2; }
.cmd { color: #b59d86; }
.note { position: absolute; left: 618px; top: 236px; width: 636px; border-radius: 40px; z-index: 2;
  display: flex; align-items: center; gap: 22px; padding: 26px 28px 26px 26px;
  background: rgba(40,35,32,.96); box-shadow: 0 0 0 2px rgba(236,200,148,.22), 0 40px 90px rgba(0,0,0,.6);
  font-family: -apple-system, 'SF Pro Text', 'Schibsted Grotesk', sans-serif; color: #f4f1ee; }
.icon { width: 78px; height: 78px; border-radius: 18px; flex: none; background: linear-gradient(180deg, #c9ab84, #a98e6c); display: grid; place-items: center; }
.text { flex: 1; min-width: 0; }
.t { font-size: 28px; font-weight: 600; line-height: 1.22; }
.b { font-size: 28px; line-height: 1.3; white-space: nowrap; }
.b .mg { color: var(--accent); font-weight: 600; }
.side { align-self: stretch; display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; }
.when { font-size: 22px; color: #a49c96; }
</style></head><body>
<svg id="beans" width="1280" height="640"></svg>
<div class="copy"><div class="name">capsule-<br>caffeine</div><div class="tagline">Caffeine in every Nespresso pod, logged to Apple Health.</div></div>
<div class="cmd">atdr.github.io/capsule-caffeine</div>
<div class="note">
  <div class="icon"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v4a6 6 0 0 1-6 6h0a6 6 0 0 1-6-6z" fill="#fff"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H15.5"/><path d="M3 21h14"/></svg></div>
  <div class="text"><div class="t">Nespresso Log</div><div class="t">Colombia</div><div class="b"><span class="mg">64 mg</span> caffeine ☕️ (1 × 64 mg)</div></div>
  <div class="side">
    <div class="when">now</div>
    <!-- A plain, unbranded capsule: a truncated cone on a rim. -->
    <svg width="64" height="56" viewBox="0 0 250 220">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5a3a24"/><stop offset=".35" stop-color="#b07a4c"/>
          <stop offset=".55" stop-color="#e0b17c"/><stop offset=".8" stop-color="#8a5a36"/><stop offset="1" stop-color="#4a2f1d"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8d8a86"/><stop offset=".5" stop-color="#e9e6e2"/><stop offset="1" stop-color="#7d7a76"/>
        </linearGradient>
      </defs>
      <path d="M78 30 Q125 20 172 30 L206 172 Q125 188 44 172 Z" fill="url(#body)"/>
      <ellipse cx="125" cy="30" rx="47" ry="9" fill="#c99363"/>
      <path d="M26 168 Q125 192 224 168 L224 178 Q125 202 26 178 Z" fill="url(#rim)"/>
    </svg>
  </div>
</div>
<script>
// Coffee beans scattered across the canvas, thinned out behind the text. Seeded, so
// every render places them the same way.
let seed = 11;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const svg = document.getElementById('beans');
const ns = 'http://www.w3.org/2000/svg';
const placed = [];
for (let tries = 0; placed.length < 22 && tries < 4000; tries++) {
  const x = rand() * 1320 - 20, y = rand() * 680 - 20, s = 20 + rand() * 18;
  if (placed.some(p => Math.hypot(p.x - x, p.y - y) < (p.s + s) * 1.5)) continue;
  // Few beans behind the name and tagline, none under the notification.
  if (x > 590 && x < 1280 && y > 200 && y < 430) continue;
  // None behind the name, tagline or URL.
  if (x > 50 && x < 660 && y > 120 && y < 470) continue;
  if (x > 50 && x < 520 && y > 560 && y < 610) continue;
  placed.push({ x, y, s });
  const g = document.createElementNS(ns, 'g');
  g.setAttribute('transform', `translate(${x} ${y}) rotate(${rand() * 360}) scale(${s / 20})`);
  g.setAttribute('opacity', (0.08 + rand() * 0.07).toFixed(2));
  g.innerHTML = '<ellipse rx="12" ry="17" fill="#e0a868"/>' +
    '<path d="M1 -15 C -6 -6 6 6 -1 15" fill="none" stroke="#160e09" stroke-width="2.6" stroke-linecap="round"/>';
  svg.appendChild(g);
}
</script>
</body></html>
