[project]
name = "capsule-caffeine"
version = "2.1.0"
description = "Scrape the caffeine content of Nespresso capsules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "jsonschema>=4.23",
    "requests>=2.32",
]

[project.scripts]
capsule-caffeine = "capsule_caffeine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# What `pytest --cov` measures, here rather than on CI's command line, so a
# local run measures what CI measures.
[tool.coverage.run]
source = ["capsule_caffeine"]
