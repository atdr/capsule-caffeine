gitignore: true
globs:
  - '**/*.md'
config:
  # 80 columns for prose. Tables and code blocks are exempt: wrapping either
  # breaks it. mdformat (.mdformat.toml) rewraps paragraphs to the same width.
  MD013:
    line_length: 80
    tables: false
    code_blocks: false
  MD046:
    style: fenced
  # mdformat writes every real heading as `# text`, and its rewrap can start a
  # line with an issue number (#21), which this rule mistakes for a heading.
  MD018: false
  # A README may open with a banner image above its title.
  MD041: false
ignores:
  # Generated by release-please.
  - CHANGELOG.md
  # A symlink to AGENTS.md, which is linted under its own name.
  - CLAUDE.md
